<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<style>
			body { margin: 30px 50px; font-family: sans-serif; }
			.dataset-block { margin-bottom: 40px; }
			.title { font-weight: bold; font-size: 1.2em; margin-bottom: 5px; }
			table { border: 1px solid black; border-collapse: collapse; margin-bottom: 15px; }
			th, td { border: 1px solid #ccc; padding: 3px 6px; text-align: right; }
			th { background: #f2f2f2; }
			svg { display: block; border: 1px solid #ccc; background: #fafafa; }
			.stats { font-size: 0.85em; margin-top: 5px; color: #444; }
    	</style>
		<title>Anscombe's quartet and plots</title>
	</head>
	<body>
		<h1>Anscombe's quartet and plots</h1>

		<script src="../vendor/d3-7.8.5/dist/d3.js"></script>
		<script>

	var body = d3.select("body");

	var s = d3.formatSpecifier("f");
      s.precision = d3.precisionFixed(0.01);
      var f = d3.format(s);

      var margin = {top: 10, right: 10, bottom: 20, left: 30},
          width  = 240 - margin.left - margin.right,
          height = 150 - margin.top - margin.bottom;

      var xScale = d3.scaleLinear().range([0, width]);
      var yScale = d3.scaleLinear().range([height, 0]);

      function linear_fit(data, x_attr, y_attr) {
        let n = data.length;
        let xs = data.map(d => d[x_attr]);
        let ys = data.map(d => d[y_attr]);
        let Sx  = d3.sum(xs);
        let Sxx = d3.sum(xs, x => x*x);
        let Sy  = d3.sum(ys);
        let Sxy = d3.sum(d3.zip(xs, ys), e => e[0]*e[1]);
        let slope = (n*Sxy - Sx*Sy) / (n*Sxx - Sx*Sx);
        let intercept = (Sy - slope*Sx) / n;
        return (x) => intercept + x*slope;
      }

    

d3.tsv("../data/anscombe.tsv", d => (
	{
		dataset:     d.dataset,
		observation: d.observation,
		x: +d.x,
		y: +d.y,
	}
)).then(data => {
	xScale.domain([0, 20]).nice();
    yScale.domain([0, 13]).nice();

	[1, 2, 3, 4].forEach(k => {
//for each dataset
          var block = body.append('div').attr('class', 'dataset-block');

          block.append('div')
            .attr('class', 'title')
            .text(`data set ${k}`);
	var dataset = data.filter(d => d.dataset == k);
          var table = block.append('table');
          var header = table.append('tr');
          header.append('th').text('obsservation');
          header.append('th').text('x');
          header.append('th').text('y');

          var row = table.selectAll('.row')
            .data(dataset)
            .join('tr')
            .attr('class', 'row');

          row.append('td').text(d => d.observation);
          row.append('td').text(d => d.x);
          row.append('td').text(d => f(d.y));

		  //plots

	var svg = block.append('svg')
        .attr('width', width + margin.left + margin.right)
        .attr('height', height + margin.top + margin.bottom)
        .append('g')
        .attr('transform', `translate(${margin.left},${margin.top})`);

	svg.selectAll('.dot')
            .data(dataset)
            .join('circle')
            .attr('class', 'dot')
            .attr('cx', d => xScale(d.x))
            .attr('cy', d => yScale(d.y))
            .attr('r', 3)
            .attr('fill', 'steelblue')
            .attr('opacity', 0.9);
	var fit = linear_fit(dataset, 'x', 'y');
          var line = d3.line()
            .x(d => xScale(d[0]))
            .y(d => yScale(d[1]));

	svg.append('path')
            .datum(xScale.domain().map(x => [x, fit(x)]))
            .attr('d', line)
            .attr('fill', 'none')
            .attr('stroke', 'red')
            .attr('stroke-width', 1.5)
            .attr('stroke-linecap', 'round');


	var xAxis = d3.axisBottom(xScale);
          svg.append('g')
            .attr('transform', `translate(0,${yScale(0)})`)
            .call(xAxis.ticks(20/5).tickSize(-10));

          svg.append('g')
            .attr('transform', `translate(0,${yScale(0)})`)
            .call(xAxis.ticks(20/1).tickSize(-5).tickFormat(''));

          var yAxis = d3.axisLeft(yScale);
          svg.append('g')
            .attr('transform', `translate(${xScale(0)},0)`)
            .call(yAxis.ticks(13/5).tickSize(-10));

          svg.append('g')
            .attr('transform', `translate(${xScale(0)},0)`)
            .call(yAxis.ticks(13/1).tickSize(-5).tickFormat(''));
	});

});
		</script>
	</body>
</html>
